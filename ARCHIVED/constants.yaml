# 遗忘失败分析 — 全局常数
# 唯一真相来源。人类版文档和 RUNBOOK 都引用这里，不要在别处复制数值。
# 放置位置：unlearning-analysis/scripts/constants.yaml

meta:
  repo_commit: "4ad738aaf60f6a4385f6e2506d01da99e76c31f3"   # 开工时确认，变了要重新过 Gate 1a
  transformers_version: "4.51.3"                            # requirements.txt 的钉版，勿降到 4.45.x
  seed: 0

# ---------------------------------------------------------------------------
# 路径约定
# ---------------------------------------------------------------------------
paths:
  cwd: "open-unlearning/"           # 所有命令以库目录为工作目录：src/train.py、src/eval.py、saves/ 都相对它
  config_dir: "../scripts/configs"  # Hydra --config-dir
  results_dir: "../results"         # 自写产物一律写 ../results/...；写成 results/... 会落进库目录
  saves_dir: "saves"                # 库的默认训练输出，在库目录内。"不改库"的唯一例外：它是 git-ignored 产物，不是代码

# ---------------------------------------------------------------------------
# 训练
# ---------------------------------------------------------------------------
training:
  effective_batch_size: 32          # per_device × accum × num_processes 必须等于这个数
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  num_train_epochs: 10
  weight_decay: 0.01
  save_strategy: steps
  save_steps: 4                     # 盘不够降到 6
  eval_strategy: "no"               # 训练中不评测，评测离线做
  # 派生量——名义值，不要当真。400 / 32 = 12.5：transformers >= 4.46 会把 epoch 末剩下的 4 个
  # micro-batch 凑成第 13 步，实际很可能是 13 步/epoch、130 步、32 个 ckpt，
  # "每第 3 个 ckpt 落在 epoch 边界"随之不成立。
  # Gate 1b 跑完后从 saves/unlearn/NPO_1b/checkpoint-*/trainer_state.json 读 max_steps 回填下面三项，
  # 并把 verified_from_trainer_state 改成 true。false 时不得进入 S5（NPO 除外）和 S6。
  steps_per_epoch: 12               # 名义值，待回填
  total_steps: 120                  # 名义值，待回填 = max_steps
  expected_checkpoints: 30          # 名义值，待回填 = floor(total_steps / save_steps)
  verified_from_trainer_state: false
  # 训练顺序：两个阳性对照紧跟 Gate 1b 的 NPO，Gate 2 才能排在扫层之前
  method_order: [NPO, RMU, RMU_downproj, GA, GD, SimNPO, DPO]

# ---------------------------------------------------------------------------
# Gate 1a — target model 自评 vs 官方下载日志（硬停）
# ---------------------------------------------------------------------------
gate_1a:
  eval_config: default              # 用库默认评测配置（官方日志就是它跑的）
  tolerance_prob: 0.01              # 概率类、truth ratio 类
  tolerance_rouge: 0.02             # ROUGE 类；贪心解码跨硬件会翻 argmax，400 条平均能差过 0.01
  borderline_frac: 0.20             # 偏差落在容差的 80%–100% 区间视为边缘
  on_rouge_borderline: "diff 逐样本生成结果后人工定性，不要自动放行"
  fallback_reference: "--eval_logs 里没有 full 的日志时，改对 docs/repro.md 的 target 行"

# ---------------------------------------------------------------------------
# Gate 1b — NPO 单方法 vs repro.md（软，超过 hard_stop 才停）
# ---------------------------------------------------------------------------
gate_1b:
  eval_config: default              # repro.md 的数是默认配置跑的；操作点候选评测归 S6，用 tofu_oppoint
  compare_weights: final            # 对 repro.md 比的是训练结束的最终权重，不是中间 ckpt
  hard_stop_delta: 0.15             # forget_Q_A_ROUGE 或 model_utility 差超过这个数 → 停（那是配错了，不是分布式噪声）
  soft_record_only: true            # 以内只记录到 notes/gate_1b_deviation.md，不停
  forget_quality_gated: false       # KS p 值量级不稳，不设判据
  after_pass: "读 trainer_state.json 回填 training.steps_per_epoch / total_steps / expected_checkpoints，verified 改 true"
  note: "repro.md 是 2×L40s + ZeRO-3 跑的，且明确警告单卡结果会变。小偏差是预期的。"

# ---------------------------------------------------------------------------
# 操作点
# ---------------------------------------------------------------------------
operating_point:
  eval_config_name: tofu_oppoint    # scripts/configs/eval/tofu_oppoint.yaml：只跑 forget_Q_A_ROUGE + model_utility
  # 阈值来自 retain model 逐样本 forget_Q_A_ROUGE 的 bootstrap
  bootstrap_n: 10000
  bootstrap_ci: 0.95
  threshold_side: upper             # 取 95% CI 上界
  retain_per_sample_source: "saves/eval/tofu_Llama-3.2-1B-Instruct_retain90/TOFU_EVAL.json 的 value_by_index"
  retain_per_sample_fallback: "下载日志里没有 value_by_index → 用默认配置自评一次 retain90，取自评的 value_by_index"
  utility_baseline_source: "Gate 1a 的 target 自评 model_utility"
  rule_A: "操作点 A = 首个 forget_Q_A_ROUGE ≤ 上界 的已评测 ckpt"
  rule_B: "操作点 B = model_utility ≥ utility_baseline × floor 的最后一个已评测 ckpt（B 不做细评）"
  utility_floor_primary: 0.80       # 相对 target model 自身的 model_utility
  utility_floor_check: 0.90         # 敏感性复核：同一批评测点上再算一份 B_check / feasible_check，一并写入 operating_point/<method>.json
  feasibility_rule: "feasible = model_utility(A) ≥ utility_baseline × floor。A 不存在（到最终权重仍未越线）也算不可行，infeasible_reason = never_crossed；A 存在但 utility 不够，infeasible_reason = utility_below_floor_at_A"
  overshoot_flag: 0.10              # 上界 − 选中 ckpt 的 ROUGE，超过则记录（不重跑）
  eval_stride_coarse: 3             # 粗评：每第 3 个 ckpt + 最终权重（若不与最后一个 ckpt 重合）
  eval_refine_count: 2              # 细评：越线区间内的 ckpt（save_steps=4、stride=3 时区间内正好 2 个）
  refine_interval_if_first_coarse_already_below: "[step 0 = target, 第一个粗评 ckpt]，评其中全部 ckpt"
  evals_per_method: 12              # 名义值；实际 = 粗评点数 + eval_refine_count，total_steps 回填后重算

# ---------------------------------------------------------------------------
# Fisher / Δθ
# ---------------------------------------------------------------------------
fisher:
  batch_size: 1                     # 硬性要求：per-sample 梯度平方，不是 batch 平均后再平方
  n_forget: 400                     # forget10 全部
  n_retain: 400                     # retain90 随机抽，与 forget 对称
  retain_sample_seed: 0
  data_pipeline: "复用库的 dataset / collator：chat template、answer-only 的 -100 mask 与训练完全一致，不自行 tokenize"
  storage: cpu
  dtype: float32
  smoke_test_samples: 20            # §0.4 审查点：先 20 条，打印若干参数的量级交人看

delta_theta:
  dtype: float32                    # 两个 bf16 state_dict 先 upcast 到 fp32 再相减、再平方
  null_baseline_draws: 5            # 同模块范数的随机方向，取均值
  aggregate_level: module           # 每层的 attention / MLP 各一个数；embed_tokens / lm_head / norm 各归入独立模块 "other"
  report: ["D_over_D_rand", "C_over_C_rand"]
  compute_for_infeasible: true      # 不可行的方法也算：A 存在就在 A 算一份，另在 B 算一份
  infeasible_marker: hollow         # 验证一散点图里用空心点，不进跨方法参数比较的统计

gradient_conflict:
  enabled_methods: ["GD"]
  mode: offline                     # 在 ckpt 上算，不进训练循环
  checkpoints: "GD 的全部粗评 ckpt（每第 eval_stride_coarse 个，≈epoch 边界）——S7 的 keep 必须保留它们"
  batch_size: 32                    # 要的是均值梯度，大 batch 正确（与 Fisher 相反）
  note: "算的是全 batch 梯度冲突，不是逐步 minibatch 冲突，标注清楚"

# ---------------------------------------------------------------------------
# Gate 2 — 阳性对照（硬停），两个对照都在扫层之前
# ---------------------------------------------------------------------------
gate_2:
  controls: [RMU, RMU_downproj]
  delta_theta_tolerance: 0.0        # 严格 0：这些层 grad 是 None，AdamW 整个跳过，weight_decay 也不作用
  RMU:
    cutoff_layer: 7                 # 两项 loss 都建在 layers.7 输出激活上，计算图止于第 7 层
    layers_must_be_zero: [8, 9, 10, 11, 12, 13, 14, 15]
    nonzero_set: "layers 0–7 全部参数 + embed_tokens"
    role: "特异性：8 个已知为零的层"
  RMU_downproj:
    trainable_params_regex: "model\\.layers\\.(5|6|7)\\.mlp\\.down_proj\\.weight"
    # 命令行传参时整个 override 用引号包住；不要给 | 加反斜杠——\| 在 Python re 里是字面竖线，
    # 模式会匹配不到任何参数、训练等于没动，最后会被误判成"到不了操作点 A"。
    # 列表还是字符串，照 configs/trainer/RMU.yaml 里注释那行的形式。
    expected_trainable_matrices: 3  # 训练前打印 requires_grad 的参数名，不恰好 3 个 → STOP-ASK #10
    layers_must_be_zero: [0, 1, 2, 3, 4, 8, 9, 10, 11, 12, 13, 14, 15]
    nonzero_set: "layers 5–7 的 mlp.down_proj.weight"
    role: "灵敏度 + 特异性：3 个已知非零的矩阵、13 个已知为零的层"
    precondition: "必须到操作点 A。默认 lr 到不了 → 按 lr_ladder 依次重跑（它不参与跨方法比较，调 lr 不影响结论）；仍到不了 → 记录后跳过，Gate 2 只剩 RMU 那一半，报告里注明"
    lr_ladder: [5.0e-5, 2.0e-4]
  criteria:                         # 四条全部满足才通过；峰值层只记录
    - "layers_must_be_zero 各层 Δθ 严格为 0（state_dict 逐元素比较，不用评测）"
    - "这些层的 restoration 恢复量严格为 0（换回等于没换，评多遍应逐位相同）"
    - "significant: true 的层全部落在 nonzero_set 内"
    - "nonzero_set 内至少 min_significant_layers 层 significant: true——否则 pipeline 什么都没检测到，gate 是空过的"
  min_significant_layers: 1
  peak_layer_is_observation_only: true
  exact_equality_tests:             # §0.4 代码测试，在 RMU 上做，自动判定，两个都必须逐位相等（含 value_by_index）
    restore_all_nonzero_layers: "所有 Δθ≠0 的层全部换回 target → tofu_cheap 结果 == target 的 tofu_cheap 自评"
    transplant_all_nonzero_layers: "所有 Δθ≠0 的层全部移植进 target → tofu_cheap 结果 == 该遗忘后模型的 tofu_cheap 自评"

# ---------------------------------------------------------------------------
# Layer restoration
# ---------------------------------------------------------------------------
restoration:
  sweep_all_layers: true            # 不做收窄；1B 16 层，3B 28 层
  n_layers_1b: 16
  n_layers_3b: 28
  cheap_config_name: tofu_cheap     # scripts/configs/eval/tofu_cheap.yaml
  cheap_metrics: ["forget_Q_A_ROUGE", "extraction_strength"]
  recovery_definition: "recovery = metric(换层后) − metric(遗忘后)；归一化版 = recovery / (metric(target) − metric(遗忘后))，target 值取 results/eval/target_cheap"
  temp_model_policy: "换层后写一个临时模型目录 → eval → 立即删；任一时刻最多存在一个临时目录。或进程内直接调库的评测器，不落盘"
  full_eval_top_k: 3                # 恢复量前 3 的层升级到全套评测（eval=tofu_full）
  significance:
    primary: bootstrap_ci           # 逐样本恢复量（配对：同一题换层后 − 遗忘后）的 bootstrap CI，下界 > 0 才算显著
    bootstrap_n: 20000
    bootstrap_ci: 0.95
    multiple_comparison: bonferroni_within_method
    n_tests_per_method: 16
    ci_effective: 0.996875          # 1 − 0.05/16；每个方法 16 次检验，不修正的话 95% CI 平均会出 ~0.8 个假阳性，全局 96 次约 5 个
    determinism_check:
      source: "RMU 8–15 层的 8 次 restoration（同一模型评 8 遍）"
      expected: 0.0                 # 贪心解码 + 固定 batch，预期逐位相同
      on_nonzero: "记为数值噪声底并上报——非 0 本身说明评测不确定，影响所有比较"

transplant:
  layers: "同 S13 的 top-k（不全扫）"

# ---------------------------------------------------------------------------
# Relearning（最小版）
# ---------------------------------------------------------------------------
relearning:
  mode: forget_subset               # 只做 forget 子集微调；retain 微调（测损伤深度）不在两周内
  split_seed: 0
  finetune_subset_frac: 0.10        # forget10 的 10% = 40 条
  finetune_file: "../results/relearn/splits/forget10_ft40.jsonl"
  heldout_indices_file: "../results/relearn/splits/forget10_heldout360_indices.json"
  start_from: "该方法的操作点 A ckpt"
  trainer_config: finetune          # 库的 finetune trainer；训练数据用 --config-dir 里自建的 data 配置指到 finetune_file（照库的 TOFU_QA_* 配置改 hf_args 为 path=json + data_files），先 dry run
  learning_rate: 2.0e-5
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1    # 有效 batch 4 → 40 条 = 10 步/epoch
  max_steps: 200
  save_steps: 10                    # 20 个 ckpt，约 50 GB，逐个评完即删
  eval_config_name: tofu_cheap      # 照常在全部 400 条上评，然后只对 heldout_indices 的 value_by_index 取平均——不需要自定义评测数据集
  eval_metric: forget_Q_A_ROUGE
  recovery_speed:
    primary: steps_to_50pct_gap     # 首个 held-out ROUGE ≥ 遗忘后 + 0.5 × (target − 遗忘后) 的步数；200 步内未达记 ">200"
    secondary: curve_auc            # 归一化恢复量对步数的曲线下面积
  min_version_methods: "阶段 2 出结果后取 C/C_rand 两端；阶段 2 被压缩则退回 NPO + DPO(idk)"
  excluded: ["GA"]                  # GA 不回弹可能是模型坏了，这一轴上是混淆的

# ---------------------------------------------------------------------------
# 评测配置（三份都放 scripts/configs/eval/，S3 一次做完、三份都 dry run、各记一次实际耗时）
# ---------------------------------------------------------------------------
metrics:
  naming_rule: "不得沿用 tofu.yaml 这个名字（会 shadow 库文件）；命令行显式传 eval=<name>"
  configs:
    tofu_full:
      metrics: "默认全部 + enabled_beyond_default"
      used_by: ["S13 可疑层全套评测", "操作点 A/B 的一次全套留档"]
    tofu_oppoint:
      metrics: ["forget_Q_A_ROUGE", "model_utility"]   # model_utility 会自动带上它的 9 个分项
      used_by: ["S6 操作点轨迹"]
    tofu_cheap:
      metrics: ["forget_Q_A_ROUGE", "extraction_strength"]
      used_by: ["S11 Gate 2", "S12 扫层", "S14 移植", "S16 relearning 曲线", "§0.4 等式测试"]
  enabled_beyond_default:
    - exact_memorization
    - mia_min_k_plus_plus
  dropped:
    mia_reference: "参考模型若用 retain90 会与 forget_quality 循环；MinK++ 是 reference-free 的，够用"
  default_already_on:
    - forget_Truth_Ratio
    - forget_quality
    - forget_Q_A_Prob
    - forget_Q_A_ROUGE
    - model_utility
    - privleak                      # 内部已经跑了 mia_min_k
    - extraction_strength
  timing_log: "notes/eval_timing.md"   # 三份配置各一次实际耗时，排期按它算

# ---------------------------------------------------------------------------
# 资源阈值
# ---------------------------------------------------------------------------
resources:
  disk_peak_gb: 80                  # 单方法 30–32 个 ckpt × 2.5 GB；选完 A/B 立刻删
  disk_stop_free_gb: 20             # 剩余空间低于此值 → STOP-ASK #5
  auto_delete_after_manifest: false # true = 预授权：manifest 写出且 delete_safety 全部满足时，agent 可不等人直接删
  delete_safety:
    never_delete: ["操作点 A", "操作点 B", "操作点 B_check", "最终权重目录", "GD 的全部粗评 ckpt"]
    require_keep_loadable: true     # keep 列表里每个 ckpt 都能 from_pretrained 成功，才允许删 delete 列表
  vram_1b_gb: 16
  vram_3b_gb: 42
  cpu_ram_fisher_1b_gb: 10          # I_f + I_r
  cpu_ram_fisher_3b_gb: 24
