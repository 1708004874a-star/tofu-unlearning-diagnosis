# @package eval.tofu
# full_v4（执行清单_v4.md §4 段A第4步）：库默认 7 个 + 解开 exact_memorization / mia_min_k_plus_plus，共 9 个。
# 不能叫 tofu.yaml —— 库里已有同名文件，会被库那份静默压过（§2.8，已实测）。
defaults:
  - tofu_metrics:
    - forget_Truth_Ratio
    - forget_quality
    - forget_Q_A_Prob
    - forget_Q_A_ROUGE
    - model_utility
    - privleak
    - extraction_strength
    - exact_memorization
    - mia_min_k_plus_plus

handler: TOFUEvaluator
output_dir: ${paths.output_dir}
metrics: {}
overwrite: false
forget_split: forget10
holdout_split: holdout10
retain_logs_path: null
question_key: "question"
batch_size: 32
