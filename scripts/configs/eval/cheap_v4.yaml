# @package eval.tofu
# cheap_v4（执行清单_v4.md §4 段A第4步）：forget_Q_A_ROUGE + extraction_strength，扫层/移植/等式测试用。
# 不能叫 tofu.yaml —— 库里已有同名文件，会被库那份静默压过（§2.8，已实测）。
# 2026-09-05 补 retain_Q_A_ROUGE：扫层要用它做 catastrophic 轴（utility 损伤）的配对 bootstrap 显著性检验
# ——model_utility 没有 value_by_index 套不进去，retain_Q_A_ROUGE 结构跟 forget_Q_A_ROUGE 一样、已实测确认
# （constants-v4.yaml: restoration.significance.metric_for_catastrophic_axis）。
defaults:
  - tofu_metrics:
    - forget_Q_A_ROUGE
    - extraction_strength
    - retain_Q_A_ROUGE

handler: TOFUEvaluator
output_dir: ${paths.output_dir}
metrics: {}
overwrite: false
forget_split: forget10
holdout_split: holdout10
retain_logs_path: null
question_key: "question"
batch_size: 32
